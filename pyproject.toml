[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evalnoise"
version = "0.6.0"
description = "Reproducible infrastructure-sensitivity experiments for evaluation workloads"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
evalnoise = "evalnoise.cli:main"

[tool.setuptools.packages.find]
include = ["evalnoise*"]

[tool.setuptools.package-data]
evalnoise = ["workbench.js"]
